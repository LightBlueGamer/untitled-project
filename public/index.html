<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prestigious Ledger</title>
    <link rel="stylesheet" href="/styles/main.css">
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <a class="site-brand" href="/">Prestigious Ledger</a>
        <nav id="accountNav" class="account-nav" aria-label="Account navigation">
          <a id="loginLink" class="btn" href="/auth/discord">Login with Discord</a>
          <div id="loggedInNav" class="logged-in-nav hidden">
            <span id="accountName" class="account-name"></span>
            <button id="leaderboardTab" class="nav-link" type="button">Leaderboard</button>
            <button id="profileTab" class="nav-link" type="button">Profile</button>
            <form action="/auth/logout" method="post">
              <button class="nav-link" type="submit">Log out</button>
            </form>
          </div>
        </nav>
      </header>
      <section id="listView">
        <div class="hero">
          <div>
            <div class="eyebrow">Chronicles of Prestige</div>
            <h1>Players’ Ledger</h1>
          </div>
          <div class="crest">✦</div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <input
              id="search"
              class="search"
              placeholder="Search adventurer..."
              autocomplete="on"
            >

            <span id="status" class="status">
              Summoning records…
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Rank</th>
                  <th scope="col">Name</th>

                  <th scope="col" data-sort="prestige">
                    <button
                      type="button"
                      class="sort-button"
                      data-sort="prestige"
                      aria-label="Sort by prestige"
                    >
                      Prestige
                      <span class="sort-arrow" aria-hidden="true">↕</span>
                    </button>
                  </th>

                  <th scope="col">Level</th>

                  <th scope="col">Experience</th>

                  <th scope="col" data-sort="balance">
                    <button
                      type="button"
                      class="sort-button"
                      data-sort="balance"
                      aria-label="Sort by balance"
                    >
                      Balance
                      <span class="sort-arrow" aria-hidden="true">↕</span>
                    </button>
                  </th>

                  <th scope="col">Profile</th>
                </tr>
              </thead>
              <tbody id="playersBody"></tbody>
            </table>
          </div>
          <nav id="pagination" class="pagination hidden" aria-label="Ledger pages"></nav>
          <div id="empty" class="empty hidden">No adventurers found.</div>
          <div id="error" class="error hidden"></div>
        </div>
      </section>
      <section id="profileView" class="hidden">
        <div class="profile-actions">
          <button id="returnToLedger" class="btn" type="button">← Return to ledger</button>
          <button id="jumpToPlayer" class="btn hidden" type="button">Find me on the leaderboard</button>
        </div>
        <div class="panel profile">
          <div class="identity">
            <div id="avatar" class="avatar">✦</div>
            <h2 id="profileName">Adventurer</h2>
            <div id="profileRank" class="profile-rank"></div>
          </div>
          <div class="stats">
            <div class="eyebrow">Character record</div>
            <h3>Statistics</h3>
            <div id="statGrid" class="stat-grid"></div>
          </div>
        </div>
      </section>
    </div>
    <script src="/scripts/main.js"></script>
  </body>
</html>
