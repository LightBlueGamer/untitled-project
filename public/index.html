<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prestigious Ledger</title>
    <link rel="stylesheet" href="/styles/main.css">
  </head>
  <body>
    <div class="wrap">
      <section id="listView">
        <div class="hero">
          <div>
            <div class="eyebrow">Chronicles of Prestige</div>
            <h1>Players’ Ledger</h1>
          </div>
          <div class="crest">✦</div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <input
              id="search"
              class="search"
              placeholder="Search adventurer..."
              autocomplete="on"
            >

            <span id="status" class="status">
              Summoning records…
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Name</th>

                  <th scope="col" data-sort="prestige">
                    <button
                      type="button"
                      class="sort-button"
                      data-sort="prestige"
                      aria-label="Sort by prestige"
                    >
                      Prestige
                      <span class="sort-arrow" aria-hidden="true">↕</span>
                    </button>
                  </th>

                  <th scope="col" data-sort="level">
                    <button
                      type="button"
                      class="sort-button"
                      data-sort="level"
                      aria-label="Sort by level and experience"
                    >
                      Level
                      <span class="sort-arrow" aria-hidden="true">↕</span>
                    </button>
                  </th>

                  <th scope="col">Experience</th>

                  <th scope="col" data-sort="balance">
                    <button
                      type="button"
                      class="sort-button"
                      data-sort="balance"
                      aria-label="Sort by balance"
                    >
                      Balance
                      <span class="sort-arrow" aria-hidden="true">↕</span>
                    </button>
                  </th>

                  <th scope="col">Profile</th>
                </tr>
              </thead>
              <tbody id="playersBody"></tbody>
            </table>
          </div>
          <nav id="pagination" class="pagination hidden" aria-label="Ledger pages"></nav>
          <div id="empty" class="empty hidden">No adventurers found.</div>
          <div id="error" class="error hidden"></div>
        </div>
      </section>
      <section id="profileView" class="hidden">
        <div class="back"><a class="btn" href="/">← Return to ledger</a></div>
        <div class="panel profile">
          <div class="identity">
            <div id="avatar" class="avatar">✦</div>
            <h2 id="profileName">Adventurer</h2>
          </div>
          <div class="stats">
            <div class="eyebrow">Character record</div>
            <h3>Statistics</h3>
            <div id="statGrid" class="stat-grid"></div>
          </div>
        </div>
      </section>
    </div>
    <script src="/scripts/main.js"></script>
  </body>
</html>
